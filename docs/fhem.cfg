defmod alarmclock MQTT2_DEVICE alarmclock
attr alarmclock alias ioBrocker Wecker
attr alarmclock devicetopic alarmclock/0
attr alarmclock icon ring
attr alarmclock room Schlafzimmer,Wecker
attr alarmclock stateFormat mode - nextAlarm
attr alarmclock readingList $DEVICETOPIC/config/enabled:.* enabled\
$DEVICETOPIC/config/skipNext:.* skipNext\
$DEVICETOPIC/config/snoozeMinutes:.* snoozeMinutes\
$DEVICETOPIC/config/preAlarmMinutes:.* preAlarmMinutes\
\
$DEVICETOPIC/runtime/countdownAlarm:.* countdownAlarm\
$DEVICETOPIC/runtime/countdownAlarmText:.* countdownAlarmText\
$DEVICETOPIC/runtime/countdownPreAlarm:.* countdownPreAlarm\
$DEVICETOPIC/runtime/countdownPreAlarmText:.* countdownPreAlarmText\
$DEVICETOPIC/runtime/nextPreAlarm:.* nextPreAlarm\
$DEVICETOPIC/runtime/nextAlarm:.* nextAlarm\
$DEVICETOPIC/runtime/sunriseBrightness:.* sunriseBrightness\
$DEVICETOPIC/runtime/state:.* mode\
\
$DEVICETOPIC/schedule/monday:.* 1_Monday\
$DEVICETOPIC/schedule/tuesday:.* 2_Tuesday\
$DEVICETOPIC/schedule/wednesday:.* 3_Wednesday\
$DEVICETOPIC/schedule/thursday:.* 4_Thursday\
$DEVICETOPIC/schedule/friday:.* 5_Friday\
$DEVICETOPIC/schedule/saturday:.* 6_Saturday\
$DEVICETOPIC/schedule/sunday:.* 7_Sunday\
$DEVICETOPIC/schedule/holiday:.* 8_Holiday\
$DEVICETOPIC/schedule/vacation:.* 9_Vacation\
\
$DEVICETOPIC/template/1_data:.* template_1\
$DEVICETOPIC/template/2_data:.* template_2\
$DEVICETOPIC/template/3_data:.* template_3\
$DEVICETOPIC/template/4_data:.* template_4\
$DEVICETOPIC/template/5_data:.* template_5
attr alarmclock setList enabled:true,false $DEVICETOPIC/action/enabled $EVTPART1\
skipNext:true,false $DEVICETOPIC/action/skipNext $EVTPART1\
stop:noArg $DEVICETOPIC/action/stop true\
snooze:noArg $DEVICETOPIC/action/snooze true\
\
1_Monday $DEVICETOPIC/action/monday $EVTPART1\
2_Tuesday $DEVICETOPIC/action/tuesday $EVTPART1\
3_Wednesday $DEVICETOPIC/action/wednesday $EVTPART1\
4_Thursday $DEVICETOPIC/action/thursday $EVTPART1\
5_Friday $DEVICETOPIC/action/friday $EVTPART1\
6_Saturday $DEVICETOPIC/action/saturday $EVTPART1\
7_Sunday $DEVICETOPIC/action/sunday $EVTPART1\
8_Holiday $DEVICETOPIC/action/holiday $EVTPART1\
9_Vacation $DEVICETOPIC/action/vacation $EVTPART1\
\
template_1_save:noArg $DEVICETOPIC/action/template_1_save true\
template_1_load:noArg $DEVICETOPIC/action/template_1_load true\
template_2_save:noArg $DEVICETOPIC/action/template_2_save true\
template_2_load:noArg $DEVICETOPIC/action/template_2_load true\
template_3_save:noArg $DEVICETOPIC/action/template_3_save true\
template_3_load:noArg $DEVICETOPIC/action/template_3_load true\
template_4_save:noArg $DEVICETOPIC/action/template_4_save true\
template_4_load:noArg $DEVICETOPIC/action/template_4_load true\
template_5_save:noArg $DEVICETOPIC/action/template_5_save true\
template_5_load:noArg $DEVICETOPIC/action/template_5_load true